[package]
name = "traced_core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
rand = "0.10.2"
uuid = { version = "1.26.1", features = ["serde", "v4"] }
geo = { version = "0.33.1", features = ["use-serde"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
roxmltree = "0.21.1"

[dev-dependencies]
tempfile = "3.27.0"
