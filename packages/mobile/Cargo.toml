[package]
name = "mobile"
version = "0.4.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["router"] }
traced_core = { workspace = true }
changelog = { workspace = true }
tokio = { version = "1", features = ["time", "sync", "rt"] }
futures = "0.3"
chrono = { version = "0.4", features = ["unstable-locales"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1.26.1"
dioxus-i18n = "0.5.1"
sys-locale = "0.3.2"
unic-langid = { version = "0.9.6", features = ["macros"] }
resvg = { version = "0.48.1", default-features = false, features = ["text"] }

[target.'cfg(target_os = "android")'.dependencies]
manganis = "0.7.10"
async-stream = "0.3"

[target.'cfg(not(target_os = "android"))'.dependencies]
dirs = "7.0.0"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[features]
default = []
mobile = ["dioxus/mobile"]
desktop = ["dioxus/desktop"]
