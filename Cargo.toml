[workspace]
resolver = "2"
members = [
  "packages/ui",
  "packages/web",
  "packages/mobile",
  "packages/api",
  "packages/traced_core",
  "packages/traced_cli",
  "packages/changelog",
]

[workspace.dependencies]
dioxus = { version = "0.7.1" }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


# workspace
ui = { path = "packages/ui" }
api = { path = "packages/api" }
traced_core = { path = "packages/traced_core" }
changelog = { path = "packages/changelog" }
